# Every push and pull request: the checks CONTRIBUTING.md lists, on Linux and macOS, the
# core's tests on Windows, and the packages a release would build for Linux, installed and
# run (tests/smoke/run.ts).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run versions
      - run: npm run build:core
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run links
      - run: npm test
      - run: npm run test:action
      # The docs, and every project the root config lists as members (the core, and the Rust,
      # Python and Go guides), each with its own adapter: one command for all of them, run by
      # this repository's own GitHub Action (action.yml), as a user's workflow runs it. npm ci
      # linked no node_modules/.bin/docattest, because the package's launcher was not built
      # yet; rebuild links it now that it is.
      - run: npm rebuild docattest
      - uses: ./
        env:
          DOCATTEST_CORE: ${{ github.workspace }}/core/target/release/docattest
      - run: npm run bench
      # The website: its tests, its build, and its playground's recordings, which must be what
      # the docattest built above prints today.
      - run: npm test --workspace website
      - run: npm run build --workspace website
      - run: npm run record:check --workspace website
      - name: cargo test, clippy, fmt
        working-directory: core
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
      - name: parity with the recordings
        run: |
          node="$(which node)"
          export DOCATTEST_ADAPTER_TYPESCRIPT="$node $PWD/adapters/typescript/dist/protocol/main.js"
          core="$PWD/core/target/release/docattest"
          node tests/parity/bench.ts --candidate "$core" --project . --runs 1
          node tests/parity/extra.ts --candidate "$core"
          node tests/parity/audit.ts --candidate "$core"
          node tests/parity/changes.ts --candidate "$core"
          node tests/parity/impact.ts --candidate "$core"
      # Conformance is run by each adapter's own tests (npm test, and unittest, go test and
      # cargo test below).
      - name: the core's messages against the schemas, and the mirror test
        run: |
          node tests/schema.ts --candidate "$PWD/core/target/release/docattest"
          node tests/mirror.ts --core "$PWD/core/target/release/docattest"
      - name: Python adapter and launcher
        working-directory: adapters/python
        run: DOCATTEST_CORE="$GITHUB_WORKSPACE/core/target/release/docattest" python -m unittest discover -s tests
      - name: Python lint, format and types (ruff and pyright, pinned in pyproject.toml)
        working-directory: adapters/python
        run: |
          python -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/lint/bin/python" -m pip install --group lint
          "$RUNNER_TEMP/lint/bin/ruff" check .
          "$RUNNER_TEMP/lint/bin/ruff" format --check .
          "$RUNNER_TEMP/lint/bin/pyright"
      - name: Go adapter and launcher
        working-directory: adapters/go
        run: DOCATTEST_CORE="$GITHUB_WORKSPACE/core/target/release/docattest" go test ./...
      - name: Go format and lint (gofmt, go vet)
        working-directory: adapters/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Rust adapter and command
        working-directory: adapters/rust
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

  # The core's tests on Windows, which a release builds a core for: paths and line endings
  # differ there, and a difference found here is not found first by a release.
  core-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo test
        working-directory: core
        run: cargo test

  # What a release does for linux-x64, end to end: the static core, every package, a fresh
  # install of each. The release workflow does the same for every platform. Twice: once on
  # the toolchains the build uses, and once on the oldest a user is promised (Node, TypeScript
  # and Python from the manifests, scripts/minimums.ts; Go from the Go guide, which no
  # manifest holds), so a minimum that stops working fails here and not for a user.
  packages:
    strategy:
      fail-fast: false
      matrix:
        toolchains: [newest, oldest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: python -m pip install ziglang==0.17.1 cargo-zigbuild==0.24.1
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl --manifest-path core/Cargo.toml
      - run: npm ci && npm run build
      - name: packages
        run: |
          core=core/target/x86_64-unknown-linux-musl/release/docattest
          node scripts/release/npm-platform.ts --platform linux-x64 --core "$core" \
            --out out/npm/core-linux-x64 --pack out/npm
          npm pack --workspace adapters/typescript --pack-destination out/npm
          python adapters/python/build_wheel.py --out out/wheels --core "linux-x64=$core"
          node scripts/release/go-archive.ts --platform linux-x64 --core "$core" --out out/go
      - name: the oldest toolchains, read from the manifests
        id: minimums
        if: matrix.toolchains == 'oldest'
        run: |
          node scripts/minimums.ts >> "$GITHUB_OUTPUT"
          echo "harness=$(which node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.toolchains == 'oldest'
        with:
          node-version: ${{ steps.minimums.outputs.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: matrix.toolchains == 'oldest'
        with:
          python-version: ${{ steps.minimums.outputs.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.toolchains == 'oldest'
        with:
          go-version: '1.21'
          cache: false
      # The harness itself needs the newest Node (it is TypeScript, run as it is); every
      # command it starts for a user (npm, npx, node, python, go) is found on the PATH, where
      # the oldest toolchains now come first. GOTOOLCHAIN=local keeps go from fetching a newer
      # toolchain on its own.
      - name: smoke test
        env:
          GOTOOLCHAIN: local
          HARNESS: ${{ steps.minimums.outputs.harness || 'node' }}
          TYPESCRIPT: ${{ steps.minimums.outputs.typescript }}
        run: |
          "$HARNESS" tests/smoke/run.ts --npm out/npm --wheels out/wheels --go out/go \
            --work "$RUNNER_TEMP/smoke" ${TYPESCRIPT:+--typescript "$TYPESCRIPT"}
