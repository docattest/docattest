[package]
name = "docattest-core"
version = "0.2.0"
edition = "2024"
description = "The language-neutral core of docattest: documentation that CI can fail."
license = "MIT"
repository = "https://github.com/docattest/docattest"
homepage = "https://docattest.github.io/docattest/"
readme = "README.md"
keywords = ["documentation", "markdown", "testing", "ci", "docs"]
categories = ["development-tools::testing", "command-line-utilities"]
# What the crate needs to build: the sources, its copy of the protocol, the build script.
include = ["src/", "protocol/", "build.rs", "README.md"]

# The library is `docattest`, the name the core's own code and its adapters use.
[lib]
name = "docattest"
path = "src/lib.rs"

[[bin]]
name = "docattest"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# markdown-rs 1.0.0 with small fixes where it parsed differently from micromark, the
# reference's parser (see vendor/markdown/PATCHES.md), published as docattest-markdown.
markdown = { package = "docattest-markdown", version = "=1.0.0", path = "vendor/markdown" }
fancy-regex = "0.16"
yaml-rust2 = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `manifest("<path>")` in facts: TOML files are read into the same data as JSON, in their order.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
# `refresh` only: a small blocking HTTP client; TLS by rustls with bundled roots, as Node bundles its own.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
