# Every pull request and push to main: fast static checks, core built once on Linux and fanned
# out across parallel parity/schema/mirror/docs/adapter jobs, and the Linux packages built once
# and smoke-tested on both the newest and oldest supported toolchains (tests/smoke/run.ts).
# Full 5-platform builds and smoke tests (including macOS and Windows) run in release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast OS-independent static checks (formatting, linting, types, links, versions, pure
  # unit tests) so trivial mistakes fail in ~1-2 minutes.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run versions
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run links
      - run: npm run test:action
      - run: npm run test:scripts
      - run: npm test --workspace website
      - run: npm run build --workspace website
      - name: Python lint, format and types (ruff and pyright, pinned in pyproject.toml)
        working-directory: adapters/python
        run: |
          python -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/lint/bin/python" -m pip install --group lint
          "$RUNNER_TEMP/lint/bin/ruff" check .
          "$RUNNER_TEMP/lint/bin/ruff" format --check .
          "$RUNNER_TEMP/lint/bin/pyright"
      - name: Go format and lint (gofmt, go vet)
        working-directory: adapters/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Core fmt and clippy
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Rust adapter fmt and clippy
        working-directory: adapters/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  # Build and test the Rust core once on Linux, then share the binary with downstream jobs.
  build-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo test
        working-directory: core
        run: cargo test
      - name: cargo build --release
        working-directory: core
        run: cargo build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-core-ubuntu-24.04
          path: core/target/release/docattest
          if-no-files-found: error

  # TypeScript package tests and docattest on its own docs + all 4 language members via this
  # repository's own GitHub Action.
  docs-and-ts:
    needs: build-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-core-ubuntu-24.04
          path: core/target/release
      - run: chmod +x core/target/release/docattest
      - run: npm ci && npm run build
      - run: npm test
      - run: npm rebuild docattest
      - uses: ./
        env:
          DOCATTEST_CORE: ${{ github.workspace }}/core/target/release/docattest

  # Adapter test suites (Python, Go, Rust).
  adapters:
    needs: build-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-core-ubuntu-24.04
          path: core/target/release
      - run: chmod +x core/target/release/docattest
      - name: Python adapter and launcher
        working-directory: adapters/python
        run: DOCATTEST_CORE="$GITHUB_WORKSPACE/core/target/release/docattest" python -m unittest discover -s tests
      - name: Go adapter and launcher
        working-directory: adapters/go
        run: DOCATTEST_CORE="$GITHUB_WORKSPACE/core/target/release/docattest" go test ./...
      - name: Rust adapter and command
        working-directory: adapters/rust
        run: cargo test

  # Parity harnesses run in parallel on Linux (outputs are OS-independent).
  parity:
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: bench,
              cmd: 'node tests/parity/bench.ts --candidate "$core" --project . --runs 1',
            }
          - { name: extra, cmd: 'node tests/parity/extra.ts --candidate "$core"' }
          - { name: audit, cmd: 'node tests/parity/audit.ts --candidate "$core"' }
          - { name: changes, cmd: 'node tests/parity/changes.ts --candidate "$core"' }
          - { name: impact, cmd: 'node tests/parity/impact.ts --candidate "$core"' }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: matrix.name == 'bench'
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.name == 'bench'
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.name == 'bench'
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-core-ubuntu-24.04
          path: core/target/release
      - run: chmod +x core/target/release/docattest
      - run: npm ci && npm run build
      - name: parity (${{ matrix.name }})
        run: |
          node="$(which node)"
          export DOCATTEST_ADAPTER_TYPESCRIPT="$node $PWD/adapters/typescript/dist/protocol/main.js"
          core="$PWD/core/target/release/docattest"
          ${{ matrix.cmd }}

  # Protocol schema validation, 4-language mirror test, drift benchmark, and website recordings.
  schema-and-mirror:
    needs: build-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-core-ubuntu-24.04
          path: core/target/release
      - run: chmod +x core/target/release/docattest
      - run: npm ci && npm run build
      - run: npm run bench
      - run: npm run record:check --workspace website
      - name: the core's messages against the schemas, and the mirror test
        run: |
          node tests/schema.ts --candidate "$PWD/core/target/release/docattest"
          node tests/mirror.ts --core "$PWD/core/target/release/docattest"

  # What a release does for linux-x64, end to end: build the static core and every package
  # once, then smoke-test fresh installs on both the newest toolchains and the oldest
  # supported toolchains (Node, TypeScript and Python from the manifests, scripts/minimums.ts;
  # Go 1.21 from the Go guide), so a minimum that stops working fails here and not for a user.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
          cache-dependency-path: adapters/go/go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: python -m pip install ziglang==0.17.1 cargo-zigbuild==0.24.1
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl --manifest-path core/Cargo.toml
      - run: npm ci && npm run build
      - name: packages
        run: |
          core=core/target/x86_64-unknown-linux-musl/release/docattest
          node scripts/release/npm-platform.ts --platform linux-x64 --core "$core" \
            --out out/npm/core-linux-x64 --pack out/npm
          npm pack --workspace adapters/typescript --pack-destination out/npm
          python adapters/python/build_wheel.py --out out/wheels --core "linux-x64=$core"
          node scripts/release/go-archive.ts --platform linux-x64 --core "$core" --out out/go
      - name: smoke test (newest toolchains)
        env:
          GOTOOLCHAIN: local
        run: |
          node tests/smoke/run.ts --npm out/npm --wheels out/wheels --go out/go \
            --work "$RUNNER_TEMP/smoke-newest"
      - name: the oldest toolchains, read from the manifests
        id: minimums
        run: |
          node scripts/minimums.ts >> "$GITHUB_OUTPUT"
          echo "harness=$(which node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.minimums.outputs.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ steps.minimums.outputs.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.21'
          cache: false
      # The harness itself needs the newest Node (it is TypeScript, run as it is); every
      # command it starts for a user (npm, npx, node, python, go) is found on the PATH, where
      # the oldest toolchains now come first. GOTOOLCHAIN=local keeps go from fetching a newer
      # toolchain on its own.
      - name: smoke test (oldest toolchains)
        env:
          GOTOOLCHAIN: local
          HARNESS: ${{ steps.minimums.outputs.harness }}
          TYPESCRIPT: ${{ steps.minimums.outputs.typescript }}
        run: |
          "$HARNESS" tests/smoke/run.ts --npm out/npm --wheels out/wheels --go out/go \
            --work "$RUNNER_TEMP/smoke-oldest" --typescript "$TYPESCRIPT"
