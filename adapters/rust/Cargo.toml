[package]
name = "docattest"
version = "0.6.1"
edition = "2024"
description = "Documentation that CI can fail, for Rust projects: the docattest command and its Rust adapter."
license = "MIT"
repository = "https://github.com/docattest/docattest"
homepage = "https://docattest.github.io/docattest/"
readme = "README.md"
keywords = ["documentation", "markdown", "testing", "ci", "docs"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["src/", "README.md", "LICENSE"]

[lib]
name = "docattest_rust"

# The command a Rust user runs: the docattest core, told how to start the Rust adapter.
[[bin]]
name = "docattest"
path = "src/bin/docattest.rs"

# The adapter the core starts. Nobody runs it by hand.
[[bin]]
name = "docattest-adapter-rust"
path = "src/bin/adapter.rs"

[dependencies]
# The core, at exactly this release's version.
docattest = { package = "docattest-core", version = "=0.6.1", path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Reading Rust from syntax: exports, doc comments, tests, what a change affects.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# A project's own [patch] tables, which its generated programs must be built with too.
toml = "0.8"

# Ending a block that overruns with everything it started: there is no std way to
# signal a process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
